<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee08a"/>
      <stop offset="1" stop-color="#2fae58"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#efe8d6"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2d9c2"/>
      <stop offset="1" stop-color="#f6f0e0"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="1" stop-color="#e5372b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b5a26" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <g filter="url(#shadow)">
    <!-- folded map: three panels -->
    <path d="M52 78 L100 62 L100 194 L52 210 Z" fill="url(#paper)"/>
    <path d="M100 62 L156 78 L156 210 L100 194 Z" fill="url(#fold)"/>
    <path d="M156 78 L204 62 L204 194 L156 210 Z" fill="url(#paper)"/>
    <!-- roads and a park -->
    <path d="M52 150 C 90 140, 120 168, 156 150 S 190 120, 204 128" fill="none" stroke="#f5b93a" stroke-width="9" stroke-linecap="round"/>
    <path d="M78 76 L 88 204" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M168 120 C 176 106, 196 108, 200 122 C 196 134, 176 136, 168 120 Z" fill="#8fd6a0"/>
    <path d="M60 112 C 72 104, 92 110, 96 120" fill="none" stroke="#8cc8f0" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- location pin -->
  <g filter="url(#shadow)">
    <path d="M128 64 c-20 0 -34 15 -34 33 c0 24 34 55 34 55 s34 -31 34 -55 c0 -18 -14 -33 -34 -33 z" fill="url(#pin)"/>
    <circle cx="128" cy="97" r="12" fill="#ffffff"/>
  </g>
</svg>
